<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2d22">
  <meta name="description" content="Dinero Hwy builds practical websites and automation for local businesses. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dinero Hwy — Coming Soon">
  <meta property="og:description" content="Software that makes your local business money while you run it.">
  <meta property="og:image" content="/assets/dinerohwy-social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dinero Hwy — Coming Soon">
  <meta name="twitter:description" content="Software that makes your local business money while you run it.">
  <meta name="twitter:image" content="/assets/dinerohwy-social-card.png">
  <link rel="icon" href="/assets/dinerohwy-mark.svg" type="image/svg+xml">
  <title>Dinero Hwy — Coming Soon</title>
  <style>
    :root {
      --forest-950: #061b14;
      --forest-900: #0b2d22;
      --forest-800: #103b2d;
      --forest-700: #1b4635;
      --cream: #f4eedc;
      --cream-muted: #c9c5b7;
      --rust: #c75a31;
      --line: rgba(244, 238, 220, 0.22);
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--forest-950); }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--cream);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 50% 26%, rgba(75, 119, 92, 0.48), transparent 31rem),
        radial-gradient(circle at 12% 90%, rgba(199, 90, 49, 0.12), transparent 25rem),
        linear-gradient(145deg, var(--forest-800), var(--forest-950) 72%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: 0.24;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .launch {
      width: min(920px, calc(100% - 32px));
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(34px, 7vh, 80px) 0 28px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 48px;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: clamp(10px, 2vh, 18px);
      padding: 10px 15px 10px 12px;
      color: var(--cream);
      background: linear-gradient(145deg, #db6e42, #a94125);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9px;
      box-shadow: 0 12px 28px rgba(4, 19, 14, 0.28), inset 0 1px rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status-star {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      color: var(--rust);
      background: var(--cream);
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 94%, 50% 72%, 21% 94%, 32% 57%, 2% 35%, 39% 35%);
      font-size: 0;
    }

    .hoodie-lockup {
      position: relative;
      width: clamp(270px, 31vw, 340px);
      margin: 0 auto clamp(-34px, -3vh, -20px);
      filter: drop-shadow(0 28px 34px rgba(2, 15, 10, 0.32));
    }

    .hoodie {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      height: auto;
    }

    .hoodie-print {
      position: absolute;
      top: 45%;
      left: 50%;
      z-index: 1;
      display: block;
      width: 50%;
      height: auto;
      opacity: 0.9;
      transform: translate(-50%, -50%) rotate(-0.15deg) scaleY(0.98);
      mix-blend-mode: multiply;
      clip-path: inset(1px round 14px);
      filter: saturate(0.82) contrast(0.92);
    }

    .hoodie-strings {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 2px 1px rgba(25, 31, 28, 0.48));
    }

    .logo {
      display: block;
      width: min(530px, 92vw);
      height: auto;
      filter: drop-shadow(0 26px 28px rgba(2, 15, 10, 0.34));
    }

    .tagline {
      max-width: 620px;
      margin: clamp(28px, 5vh, 48px) auto 0;
      color: var(--cream);
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 690;
      line-height: 1.18;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .route {
      width: min(390px, 68vw);
      height: 4px;
      margin-top: clamp(28px, 5vh, 48px);
      position: relative;
      overflow: visible;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--rust) 18%, var(--rust) 82%, transparent);
    }

    .route::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      content: "";
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--rust);
      border: 3px solid var(--forest-900);
      box-shadow: 0 0 0 2px var(--cream);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-top: 22px;
      color: rgba(244, 238, 220, 0.55);
      border-top: 1px solid var(--line);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    footer span:last-child { color: rgba(244, 238, 220, 0.72); }

    @media (max-width: 600px) {
      .launch { width: min(100% - 24px, 920px); padding-top: 24px; gap: 34px; }
      .status { margin-bottom: 8px; }
      .hoodie-lockup { width: min(290px, 82vw); margin-bottom: -24px; }
      .logo { width: min(520px, 100%); }
      footer { flex-direction: column; justify-content: center; text-align: center; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .content { animation: arrive 700ms cubic-bezier(.2, .8, .2, 1) both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="launch">
    <section class="content" aria-labelledby="launch-title">
      <div class="status"><span class="status-star" aria-hidden="true"></span>Coming soon</div>
      <div class="hoodie-lockup">
        <img class="hoodie" src="/assets/dinerohwy-hoodie.png" width="1024" height="1536" alt="White hoodie with the Dinero Hwy street-sign graphic">
        <img class="hoodie-print" src="/assets/dinerohwy-logo-apparel.svg?v=2" alt="" aria-hidden="true">
        <svg class="hoodie-strings" viewBox="0 0 1024 1536" aria-hidden="true">
          <g fill="none" stroke="#fffefa" stroke-width="14" stroke-linecap="round">
            <path d="M455 373 C451 451 454 570 456 664"/>
            <path d="M562 373 C565 452 561 571 560 664"/>
          </g>
          <g fill="#ecebe6" stroke="#d7d6d0" stroke-width="2">
            <rect x="449" y="652" width="14" height="34" rx="6"/>
            <rect x="553" y="652" width="14" height="34" rx="6"/>
          </g>
        </svg>
      </div>
      <img class="logo" src="/assets/dinerohwy-logo-primary.svg?v=2" alt="Dinero Hwy">
      <h1 id="launch-title" class="tagline">Mr. Cruz Loves MEAT!</h1>
      <div class="route" aria-hidden="true"></div>
    </section>
    <footer><span>Dinero Hwy</span><span>Houston, Texas</span></footer>
  </main>
</body>
</html>
