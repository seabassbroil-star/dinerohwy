<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Dinero Hwy</title>
  <desc id="desc">A green street-sign reading Dinero, with a small black HWY tab offset in the upper-right corner and a nail in each corner.</desc>
  <rect x="5" y="6" width="630" height="190" rx="22" fill="#08251c"/>
  <rect x="10" y="10" width="620" height="180" rx="18" fill="#1b4635" stroke="#0a2119" stroke-width="2"/>
  <rect x="24" y="24" width="592" height="152" rx="10" fill="none" stroke="#f4eedc" stroke-width="5"/>
  <text x="300" y="144" text-anchor="middle" fill="#f4eedc" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="110" font-weight="700" textLength="384" lengthAdjust="spacingAndGlyphs">Dinero</text>
  <rect x="496" y="34" width="104" height="52" rx="9" fill="#0d0f0b" stroke="#000" stroke-width="1"/>
  <text x="548" y="71" text-anchor="middle" fill="#f4eedc" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="850" letter-spacing="1">HWY</text>
  <g fill="#efe9d7" stroke="#0a2119" stroke-width="1.5">
    <circle cx="46" cy="46" r="5.5"/>
    <circle cx="46" cy="154" r="5.5"/>
    <circle cx="594" cy="154" r="5.5"/>
    <circle cx="585" cy="49" r="5.5"/>
  </g>
</svg>
